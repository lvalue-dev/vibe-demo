services:
  - type: web
    name: vibe-demo-backend
    env: node
    region: singapore   # 한국과 가장 가까운 리전
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: KIS_MODE
        value: paper          # 처음엔 모의투자로 시작. 실전은 'real'로 변경
      - key: KIS_APP_KEY
        sync: false           # Render 대시보드에서 직접 입력
      - key: KIS_APP_SECRET
        sync: false           # Render 대시보드에서 직접 입력
      - key: FRONTEND_URL
        value: https://lvalue-dev.github.io  # 실제 배포 URL로 변경
