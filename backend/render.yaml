services:
  - type: web
    name: stockguide-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: KIS_MODE
        value: real
      - key: KIS_APP_KEY
        sync: false          # Render 대시보드에서 직접 입력
      - key: KIS_APP_SECRET
        sync: false          # Render 대시보드에서 직접 입력
      - key: FRONTEND_URL
        sync: false          # 프론트엔드 배포 후 URL 입력

