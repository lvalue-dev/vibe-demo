spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stockguide
    username: postgres
    password: password

  data:
    redis:
      url: redis://localhost:6379

  jpa:
    hibernate:
      ddl-auto: create-drop   # 로컬: 앱 시작 시 테이블 생성, 종료 시 삭제
    show-sql: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

stock:
  collector:
    enabled: false   # 로컬에서는 자동 수집 끔 (Yahoo API 호출 최소화)

logging:
  level:
    com.stockguide: INFO
    org.springframework.security: WARN
