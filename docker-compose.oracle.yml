services:
  backend:
    build: ./backend
    expose:
      - "3001"
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
