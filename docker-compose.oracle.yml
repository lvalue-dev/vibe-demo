##############################################################################
# Oracle Cloud Free Tier – A1 ARM (4 OCPU + 24 GB)
#
# ┌─────────────────────────────────────────────────────────────────┐
# │  환경       │ 프론트엔드       │ 백엔드           │ 데이터       │
# │─────────────│─────────────────│─────────────────│─────────────│
# │  개발계     │ GitHub Pages     │ Render (Node.js) │ Yahoo Finance│
# │  운영계     │ GitHub Pages     │ Oracle (Java)    │ KIS API      │
# └─────────────────────────────────────────────────────────────────┘
#
# 이 파일은 운영계(Oracle) 서비스만 포함:
#   backend-java  – Spring Boot + KIS API  (포트 8080)
#   db            – PostgreSQL 15          (내부 전용)
#   redis         – Redis 7                (내부 전용)
#   n8n           – 워크플로우 자동화       (포트 5678)
#   mcp-server    – Claude MCP             (내부 전용)
#
# 프론트엔드는 GitHub Pages 사용
#   → GitHub Secrets: VITE_API_URL = http://<Oracle-IP>:8080
#
# 실행:
#   cp backend/.env.example .env.oracle   # KIS 키 등 편집
#   docker compose -f docker-compose.oracle.yml --env-file .env.oracle up -d --build
##############################################################################

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: stockguide
      POSTGRES_USER: ${DB_USER:-stockguide}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockguide}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  # ── Java 백엔드 (Spring Boot + 한국투자증권 KIS API) ─────────────────────────
  backend-java:
    build:
      context: ./backend
      dockerfile: Dockerfile.java
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/stockguide
      DATABASE_USERNAME: ${DB_USER:-stockguide}
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      # 한국투자증권 KIS API (apiportal.koreainvestment.com)
      KIS_APP_KEY: ${KIS_APP_KEY:?KIS_APP_KEY required}
      KIS_APP_SECRET: ${KIS_APP_SECRET:?KIS_APP_SECRET required}
      KIS_MODE: ${KIS_MODE:-real}
      # GitHub Pages 프론트엔드 CORS 허용
      CORS_ORIGINS: "https://lvalue-dev.github.io"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }

  # ── MCP Server (Claude 주식 데이터 조회) ─────────────────────────────────────
  mcp-server:
    build: ./mcp-server
    expose:
      - "3002"
    environment:
      BACKEND_URL: "http://backend-java:8080"
      PORT: "3002"
    depends_on:
      - backend-java
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  # ── n8n (워크플로우 자동화 · 알림) ──────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_PASSWORD:?N8N_PASSWORD required}"
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://localhost:5678/"
      STOCKGUIDE_API: "http://backend-java:8080"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      NODE_OPTIONS: "--max-old-space-size=384"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend-java
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

volumes:
  pg_data:
    driver: local
  n8n_data:
    driver: local
