name: Deploy StockGuide to GitHub Pages

on:
  push:
    branches: ['claude/stock-guide-app-H4Egb']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # ── 개발계 백엔드 URL (Yahoo Finance) ─────────────────────────────
          # Render에 Node.js 백엔드(render.yaml) 배포 후 URL을 Secrets에 입력
          # Settings > Secrets > VITE_API_URL = https://stockguide-dev-yahoo.onrender.com
          #
          # ── 운영계 전환 시 (KIS API) ──────────────────────────────────────
          # Oracle에 Java 백엔드(docker-compose.oracle.yml) 배포 후 URL로 교체
          # VITE_API_URL = http://<Oracle-IP>:8080
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Gemini API 키 (개발계 AI 채팅용, 백엔드 없이 브라우저 직접 호출)
          # Settings > Secrets > VITE_GEMINI_API_KEY (https://aistudio.google.com 무료 발급)
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          # GitHub Pages 경로: /<repo-name>/
          VITE_BASE_URL: /vibe-demo/

      - name: Copy build output to docs/
        run: |
          rm -rf docs
          cp -r frontend/dist/. docs/
          # SPA 라우팅: 모든 경로에서 index.html 반환
          cp docs/index.html docs/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy StockGuide to GitHub Pages'
