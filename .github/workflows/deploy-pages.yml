name: Deploy StockGuide to GitHub Pages

on:
  push:
    branches: ['claude/stock-guide-app-H4Egb']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Render 백엔드 URL — GitHub 리포지토리 Settings > Secrets > VITE_API_URL 에 입력
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Copy build output to docs/
        run: |
          rm -rf docs
          cp -r frontend/dist/. docs/
          # SPA 라우팅: 모든 경로에서 index.html 반환
          cp docs/index.html docs/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy StockGuide to GitHub Pages'
